name: EGM4000 C003 Production Security

on:
  push:
    branches: [ main ]
    paths:
      - "fullstack/**"
      - ".github/workflows/c003-production-security-smoke.yml"
  pull_request:
    paths:
      - "fullstack/**"
      - ".github/workflows/c003-production-security-smoke.yml"
  workflow_dispatch:

jobs:
  production-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fullstack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime dependency
        run: pip install -r requirements.txt
      - name: Production security contract
        run: |
          python -m py_compile production_readiness.py server.py test_production_hardening.py test_security_ops_runtime.py
          EGM_ASSEMBLE_ONLY=1 python server.py
          node --check static/app.js
          python test_production_hardening.py
          python test_security_ops_runtime.py
