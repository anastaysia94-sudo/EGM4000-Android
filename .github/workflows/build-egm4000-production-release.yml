name: Build EGM4000 Production-Signed Release

on:
  workflow_dispatch:

jobs:
  production-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Require production signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.EGM_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.EGM_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EGM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EGM_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing EGM_ANDROID_KEYSTORE_B64' >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing EGM_ANDROID_STORE_PASSWORD' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing EGM_ANDROID_KEY_ALIAS' >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing EGM_ANDROID_KEY_PASSWORD' >&2; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/egm4000-production.jks"
          chmod 600 "$RUNNER_TEMP/egm4000-production.jks"
      - name: Build production-signed APK and AAB
        working-directory: android-egm4000
        env:
          STORE_PASSWORD: ${{ secrets.EGM_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EGM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EGM_ANDROID_KEY_PASSWORD }}
          EGM_API_BASE_URL: ${{ vars.EGM_API_BASE_URL }}
        run: |
          test -n "$EGM_API_BASE_URL" || { echo 'Repository variable EGM_API_BASE_URL must point to the public HTTPS backend.' >&2; exit 1; }
          case "$EGM_API_BASE_URL" in https://*) ;; *) echo 'EGM_API_BASE_URL must use HTTPS' >&2; exit 1 ;; esac
          gradle :app:assembleRelease :app:bundleRelease \
            -PEGM_API_BASE_URL="$EGM_API_BASE_URL" \
            -PEGM_SIGNING_STORE_FILE="$RUNNER_TEMP/egm4000-production.jks" \
            -PEGM_SIGNING_STORE_PASSWORD="$STORE_PASSWORD" \
            -PEGM_SIGNING_KEY_ALIAS="$KEY_ALIAS" \
            -PEGM_SIGNING_KEY_PASSWORD="$KEY_PASSWORD" \
            --stacktrace
      - name: Verify production artifacts
        shell: bash
        run: |
          apksigner verify --verbose android-egm4000/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -strict android-egm4000/app/build/outputs/bundle/release/app-release.aab
          aapt dump badging android-egm4000/app/build/outputs/apk/release/app-release.apk | grep "package: name='com.smartpickshop.egm4000'"
      - name: Upload production release
        uses: actions/upload-artifact@v4
        with:
          name: EGM4000-Android-v0.3-production-signed
          path: |
            android-egm4000/app/build/outputs/apk/release/app-release.apk
            android-egm4000/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
