name: EGM4000 Fullstack Smoke

on:
  push:
    branches: [ main ]
    paths:
      - "fullstack/**"
      - ".github/workflows/fullstack-smoke.yml"
  pull_request:
    paths:
      - "fullstack/**"
      - ".github/workflows/fullstack-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fullstack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime dependency
        run: pip install -r requirements.txt
      - name: Assemble and syntax-check
        run: |
          python -m py_compile *.py
          EGM_ASSEMBLE_ONLY=1 python server.py
          node --check static/app.js
      - name: Registry structural integrity
        run: |
          python - <<'PY'
          from admin_registry import ADMIN_CAPABILITIES
          assert len(ADMIN_CAPABILITIES) == 100
          ids = [item['id'] for item in ADMIN_CAPABILITIES]
          assert len(set(ids)) == 100
          assert ids == [f'A{i:03d}' for i in range(1, 101)]
          allowed = {'implemented', 'modelled', 'provider_configuration_required'}
          assert all(item['implementation_status'] in allowed for item in ADMIN_CAPABILITIES)
          assert all(item['title'] and item['category'] and item['evidence'] for item in ADMIN_CAPABILITIES)
          print('Admin registry structure verified')
          PY
      - name: Core product regressions
        run: |
          python test_core_loop_integration.py
          python test_return_features.py
          python test_coaching_trends.py
