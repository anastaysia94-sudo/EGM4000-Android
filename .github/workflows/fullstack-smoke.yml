name: EGM4000 Fullstack Smoke

on:
  push:
    branches: [ main ]
    paths: ["fullstack/**", ".github/workflows/fullstack-smoke.yml"]
  pull_request:
    paths: ["fullstack/**", ".github/workflows/fullstack-smoke.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fullstack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install runtime dependency
        run: pip install -r requirements.txt
      - name: Assemble and syntax-check
        env: {EGM_ASSEMBLE_ONLY: "1"}
        run: |
          python -m py_compile bootstrap_db.py storage.py live_intelligence.py admin_registry.py server.py
          python server.py
          node --check static/app.js
      - name: Fresh database bootstrap
        env: {EGM_OWNER_PASSWORD: ci-test-owner-password-not-for-production}
        run: |
          rm -rf data
          python bootstrap_db.py --force
          python - <<'PY'
          import sqlite3
          from admin_registry import ADMIN_CAPABILITIES,sync_admin_registry
          from storage import connect
          con=connect();sync_admin_registry(con);con.close()
          c=sqlite3.connect('data/egm4000.db')
          expected={'users':238,'gameplay_sessions':948,'tips':948,'forum_threads':237,'forum_replies':237,'blog_posts':237,'blog_comments':237,'surveys':2,'survey_questions':6,'admin_features':100,'monetization_channels':25,'return_features':49,'checklist':161}
          for table,n in expected.items():
              got=c.execute(f'SELECT COUNT(*) FROM {table}').fetchone()[0]
              assert got==n,(table,got,n)
          rows=c.execute('SELECT id,title,category,implementation_status FROM admin_features ORDER BY id').fetchall()
          assert len(rows)==100
          assert len(ADMIN_CAPABILITIES)==100
          assert all(not title.startswith('Admin capability ') for _,title,_,_ in rows)
          statuses={s:sum(1 for r in rows if r[3]==s) for s in {'implemented','modelled','provider_configuration_required'}}
          assert statuses=={'implemented':42,'modelled':33,'provider_configuration_required':25},statuses
          assert len({r[2] for r in rows})==9
          for fid in ('A015','A021','A022','A053','A057'):
              assert c.execute('SELECT done FROM checklist WHERE id=?',(fid,)).fetchone()[0]==1,fid
          assert c.execute("SELECT done FROM checklist WHERE id='A071'").fetchone()[0]==0
          print('full seed + C007 Admin 100 registry verified',statuses)
          PY
          test -f data/seed_users_credentials.generated.csv
      - name: Public and owner API smoke
        env: {EGM_OWNER_PASSWORD: ci-test-owner-password-not-for-production}
        run: |
          python server.py > /tmp/egm4000.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8040/api/health | grep -q 'egm.event.v1' && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8040/api/community/threads | grep -q 'Session Review'
          curl -fsS http://127.0.0.1:8040/api/surveys/active | grep -q 'First Visit Pulse'
          curl -fsS -c /tmp/egm.cookies -H 'Content-Type: application/json' -d '{"username":"EGM4000Owner","password":"ci-test-owner-password-not-for-production"}' http://127.0.0.1:8040/api/login | grep -q '"ok": true'
          curl -fsS -b /tmp/egm.cookies http://127.0.0.1:8040/api/admin/features | grep -q 'User search and filters'
          curl -fsS -b /tmp/egm.cookies 'http://127.0.0.1:8040/api/admin/users?q=AquaPilot001&synthetic=1' | grep -q 'AquaPilot001'
          curl -fsS -b /tmp/egm.cookies 'http://127.0.0.1:8040/api/admin/user?id=2' | grep -q 'gameplay_sessions'
          curl -fsS -b /tmp/egm.cookies 'http://127.0.0.1:8040/api/admin/reports?status=open&target_type=forum_thread' | grep -q '"reports"'
