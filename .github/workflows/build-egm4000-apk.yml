name: Build EGM4000 Fire Kirin APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-egm4000-apk.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble and cryptographically verify EGM4000 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, string

          expected = {
              1: '8bac82ed11c75210c47d7a840bd1a0fe021f3b78d0859227514df905e1396b52',
              2: 'a40000a52b6c05c68eab65485fbabaa5791b7ba68495943a691a6250e4387f25',
              3: 'd5171b9c6e08b49f652b5316f6dd349aa7d9bac5bc7240fc5512aa64a2887cbd',
              4: '7d0b7a82873832cea34b53f9746145fbf25bf2e475b3fa389cea69e2dea6700d',
          }
          parts = {}
          for i in range(1, 5):
              p = Path(f'buildsrc/egm4000-source.part{i}.b64')
              s = ''.join(p.read_text().split())
              parts[i] = s
              got = hashlib.sha256(s.encode()).hexdigest()
              print(f'part{i}: len={len(s)} sha256={got}')

          # Part 3 lost one base64 character while traversing the connector.
          # Recover the exact byte by requiring its machine-generated SHA-256.
          if hashlib.sha256(parts[3].encode()).hexdigest() != expected[3]:
              s = parts[3]
              if len(s) != 7767:
                  raise SystemExit(f'Unexpected part3 length: {len(s)}')
              alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + '+/'
              found = None
              for pos in range(len(s) + 1):
                  prefix, suffix = s[:pos], s[pos:]
                  for ch in alphabet:
                      candidate = prefix + ch + suffix
                      if hashlib.sha256(candidate.encode()).hexdigest() == expected[3]:
                          found = candidate
                          print(f'Recovered missing part3 character at offset {pos}: {ch!r}')
                          break
                  if found is not None:
                      break
              if found is None:
                  raise SystemExit('Could not deterministically repair part3')
              parts[3] = found

          for i in range(1, 5):
              got = hashlib.sha256(parts[i].encode()).hexdigest()
              if got != expected[i]:
                  raise SystemExit(f'part{i} SHA mismatch after repair: {got}')

          joined = ''.join(parts[i] for i in range(1, 5))
          raw = base64.b64decode(joined, validate=True)
          archive_sha = hashlib.sha256(raw).hexdigest()
          expected_archive = '0ee64d0032f7cf264dc26cecf9a142acad10af37a0014621cf8ff44e360acb39'
          print('archive sha256=', archive_sha)
          if archive_sha != expected_archive:
              raise SystemExit('Reconstructed archive SHA mismatch')
          Path('/tmp/egm4000-source.tar.gz').write_bytes(raw)
          PY
          tar -xzf /tmp/egm4000-source.tar.gz
          test -f android-egm4000/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build installable debug APK
        working-directory: android-egm4000
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EGM4000-Fire-Kirin-Companion-debug-apk
          path: android-egm4000/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
