name: Build EGM4000 Android v0.2.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "android-egm4000/**"
      - ".github/workflows/build-egm4000-apk.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v0.2.1 source contract
        run: |
          grep -q '0.2.1-server-health' android-egm4000/app/build.gradle.kts
          grep -q 'ServerSetupActivity' android-egm4000/app/src/main/AndroidManifest.xml
          grep -q '/api/health' android-egm4000/app/src/main/java/com/smartpickshop/egm4000/ServerSetupActivity.java
          grep -q 'egm.event.v1' android-egm4000/app/src/main/java/com/smartpickshop/egm4000/ServerSetupActivity.java
          grep -q '/api/mobile/login' android-egm4000/app/src/main/java/com/smartpickshop/egm4000/MainActivity.java
          grep -q '/api/mobile/sync' android-egm4000/app/src/main/java/com/smartpickshop/egm4000/MainActivity.java
          grep -q '/api/mobile/tips' android-egm4000/app/src/main/java/com/smartpickshop/egm4000/MainActivity.java
          grep -q 'AndroidKeyStore' android-egm4000/app/src/main/java/com/smartpickshop/egm4000/SecureTokenStore.java
          grep -q 'Share JSON' android-egm4000/app/src/main/java/com/smartpickshop/egm4000/MainActivity.java
          grep -q 'Import / Paste JSON' android-egm4000/app/src/main/java/com/smartpickshop/egm4000/MainActivity.java

      - name: Build installable debug APK
        working-directory: android-egm4000
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EGM4000-Android-v0.2.1-debug-apk
          path: android-egm4000/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
