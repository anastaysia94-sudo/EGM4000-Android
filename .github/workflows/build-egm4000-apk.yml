name: Build EGM4000 Fire Kirin APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-egm4000-apk.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore embedded EGM4000 Android source
        shell: bash
        run: |
          cat > /tmp/egm4000-source.b64 <<'EGM4000_B64'
 i1MUAbZVZ5fX7afaSXuIjnt5GADfyQG5/fzEYR6g3z/4WaQ6Z4kZQkcBo7euFcANfzsNEIG7V3wDr8Rzp9NEnmH7PZe7TCyhbzCI1O649EpJ5DqzfiO6AWSSTc4xdfHWP/ey/+w/PwPDwPz8Dw8D8/D8/A8PA/Pw/PwPDwPz8Pz8Dw8D8/D8/A8PA/Pw/Pw/PMbP/8AuAEAAA==
EGM4000_B64
          tr -d '[:space:]' < /tmp/egm4000-source.b64 | base64 -d > /tmp/egm4000-source.tar.gz
          tar -xzf /tmp/egm4000-source.tar.gz
          test -f android-egm4000/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        working-directory: android-egm4000
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        working-directory: android-egm4000
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EGM4000-Fire-Kirin-Companion-debug-apk
          path: android-egm4000/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
