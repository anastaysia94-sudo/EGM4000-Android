name: Build EGM4000 Android v0.3 APK + AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "android-egm4000/**"
      - ".github/workflows/build-egm4000-apk.yml"

jobs:
  build-android-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v0.3 production-handoff contract
        run: |
          grep -q '0.3.0-production-ready' android-egm4000/app/build.gradle.kts
          grep -q 'EGM_API_BASE_URL' android-egm4000/app/build.gradle.kts
          grep -q '/api/health/ready' android-egm4000/app/src/main/java/com/smartpickshop/egm4000/ServerSetupActivity.java
          grep -q 'usesCleartextTraffic="false"' android-egm4000/app/src/main/AndroidManifest.xml
          grep -q 'allowBackup="false"' android-egm4000/app/src/main/AndroidManifest.xml
          grep -q '/api/mobile/login' android-egm4000/app/src/main/java/com/smartpickshop/egm4000/MainActivity.java
          grep -q '/api/mobile/sync' android-egm4000/app/src/main/java/com/smartpickshop/egm4000/MainActivity.java
          grep -q '/api/mobile/tips' android-egm4000/app/src/main/java/com/smartpickshop/egm4000/MainActivity.java
          grep -q 'AndroidKeyStore' android-egm4000/app/src/main/java/com/smartpickshop/egm4000/SecureTokenStore.java

      - name: Build CI-signed debug APK and AAB
        working-directory: android-egm4000
        env:
          EGM_API_BASE_URL: ${{ vars.EGM_API_BASE_URL }}
        run: |
          EXTRA=""
          if [ -n "$EGM_API_BASE_URL" ]; then EXTRA="-PEGM_API_BASE_URL=$EGM_API_BASE_URL"; fi
          gradle :app:assembleDebug :app:bundleDebug $EXTRA --stacktrace

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EGM4000-Android-v0.3-debug-signed
          path: |
            android-egm4000/app/build/outputs/apk/debug/app-debug.apk
            android-egm4000/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
