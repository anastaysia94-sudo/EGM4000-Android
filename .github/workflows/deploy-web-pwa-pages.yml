name: Deploy EGM4000 Web/PWA to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "public-site/**"
      - "fullstack/static/egm4000-mark.svg"
      - ".github/workflows/deploy-web-pwa-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble public PWA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp public-site/index.html dist/index.html
          cp fullstack/static/egm4000-mark.svg dist/icon.svg
          cat > dist/manifest.webmanifest <<'JSON'
          {
            "name": "EGM4000 / EduGameMaster 4000",
            "short_name": "EGM4000",
            "description": "Evidence-grounded fish-shooter gameplay intelligence, community, session analysis, surveys and safe research.",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "background_color": "#020711",
            "theme_color": "#03101d",
            "icons": [
              {"src":"./icon.svg","sizes":"512x512","type":"image/svg+xml","purpose":"any maskable"}
            ]
          }
          JSON
          cat > dist/sw.js <<'JS'
          const CACHE='egm4000-public-supabase-v1';
          const ASSETS=['./','./index.html','./manifest.webmanifest','./icon.svg'];
          self.addEventListener('install',event=>event.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(ASSETS))));
          self.addEventListener('activate',event=>event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))));
          self.addEventListener('fetch',event=>{
            if(event.request.method!=='GET') return;
            const url=new URL(event.request.url);
            if(url.origin.includes('supabase.co')||url.origin.includes('esm.sh')) return;
            event.respondWith(fetch(event.request).then(response=>{
              const copy=response.clone();
              caches.open(CACHE).then(cache=>cache.put(event.request,copy));
              return response;
            }).catch(()=>caches.match(event.request)));
          });
          JS

      - name: Validate public Web/PWA
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icon.svg
          grep -q 'EGM4000' dist/index.html
          grep -q 'supabase-js' dist/index.html
          grep -q 'serviceWorker' dist/index.html
          grep -q 'Community' dist/index.html
          grep -q 'Surveys' dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Web/PWA artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
