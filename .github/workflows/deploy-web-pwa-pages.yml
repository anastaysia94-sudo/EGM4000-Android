name: Deploy EGM4000 Web/PWA to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web-pwa-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public Web/PWA
        run: |
          test -f web/index.html
          test -f web/manifest.webmanifest
          test -f web/sw.js
          grep -q 'EGM4000' web/index.html
          grep -q 'serviceWorker' web/index.html
          grep -q 'Community forum + blog' web/index.html
          grep -q 'Privacy-preserving visitor surveys' web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Web/PWA artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
