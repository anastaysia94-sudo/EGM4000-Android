name: EGM4000 C015 Android Emulator Acceptance

on:
  push:
    branches: [ main ]
    paths:
      - "android-egm4000/**"
      - ".github/workflows/c015-android-emulator-smoke.yml"
  pull_request:
    paths:
      - "android-egm4000/**"
      - ".github/workflows/c015-android-emulator-smoke.yml"
  workflow_dispatch:

jobs:
  emulator-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build installable QA APK
        working-directory: android-egm4000
        run: gradle :app:assembleDebug --stacktrace
      - name: Enable KVM for the Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android-egm4000/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.smartpickshop.egm4000
            adb shell monkey -p com.smartpickshop.egm4000 -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell pidof com.smartpickshop.egm4000 | grep -E '[0-9]+'
            adb shell dumpsys package com.smartpickshop.egm4000 | grep 'versionName=0.3.0-production-ready'
            adb shell dumpsys activity activities | grep -m1 'com.smartpickshop.egm4000'
            if adb logcat -d -b crash | grep -q 'com.smartpickshop.egm4000'; then
              echo 'EGM4000 crash buffer contains an app crash' >&2
              adb logcat -d -b crash >&2
              exit 1
            fi
            echo 'C015 emulator install/launch acceptance passed'
